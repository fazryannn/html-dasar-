<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form html</title>
  </head>
  <body>
    <!-- form adalah sebuah elemen pada html yang digunakan untuk mengelola data dari imput yang dilakukan user
    elemen yang ada di form input, textarea, select, button, label-->
      <label for="username">Username:</label>
      <input type="text" id="username">
      <br>
      <label for="password">Password:</label>
      <input type="password" id="password">
      <br>
      <input type="radio" id="pria" name="jeniskelamin"><label for="pria">Pria</label>
      <input type="radio" id="wanita" name="jeniskelamin"><label for="wanita">Wanita</label>
      <br>
      <input type="checkbox" id="olahraga"><label for="olahraga">Olahraga</label>
      <input type="checkbox" id="memancing"><label for="memancing">Memancing</label>
      <input type="checkbox" id="game"><label for="game">Game</label>
      <br>
      <textarea></textarea>
      <br>
      <select>
        <option>Bandung</option>
        <option>Jakarta</option>
        <option>Yogyakarta</option>
      </select>
      <br>
      <button type="submit">Kirim</button>
  </body>
</html>
