<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hyperlink Html</title>
  </head>
  <body>
    <h2>Hyperlink Html</h2>
    <p>
      Adalah sebuah <strong>Koneksi</strong> dari sumber web ke sumber lain
      dibuat dengan tag a (anchor)
    </p>
    <!-- link external untuk link untuk membuka ke website lain -->
    <p>
      klik <a href="https://www.w3schools.com/">disini</a> untuk mempelajari
      lebih lanjut
    </p>
    <!-- link internal link membuka halaman web didomain/folder yang sama -->
    <p><a href="halaman1.html">Pergi ke halaman 1</a></p>
    <!-- relative link membuka halaman ke folder yang berbeda 
     masuk dulu ke folder lalu cari halaman yang di tuju (../ untuk naik satu tingkat ke folder)-->
    <p><a href="admin/admin.html">Masuk Ke halaman admin</a></p>
    <!-- Page anchor link bagian tertentu dari sebuah halaman  atribut id (digunakan untuk jadi penanda tiap bagian/anchor)
     # penanda untuk id, atribut target unuk membuka halaman dengan tab baru -->
    <a href="halaman2.html" target="_blank">Halaman 2</a>
    <p><a href="halaman1.html#bagian3">Halaman 2 bagian 3</a></p>
  </body>
</html>
