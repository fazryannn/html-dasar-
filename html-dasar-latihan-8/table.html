<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table Html</title>
  </head>
  <body>
    <!-- struktur table tr(baris),td(kolom), atribut border(menambahkan garis di sekitar cell),cellspacing(menambahkan jarak antar cell)
     cellpadding(memberi luas pada cell) -->
    <table border="1" cellspacing="0" cellpadding="5">
      <tr>
        <td>Baris 1 kolom 1</td>
        <td>baris 1 kolom 2</td>
      </tr>
      <tr>
        <td>baris 2 kolom 1</td>
        <td>baris 2 kolom 2</td>
      </tr>
    </table>
    <!-- thead(menmbahkan header pada table),tbody(), th(), tr()
     -->
    <table border="1" cellspacing="0" cellpadding="5">
      <thead>
        <tr>
          <th></th>
          <th>Kolom 1</th>
          <th>Kolom 2</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>Baris 1</th>
          <th>Baris 1, Kolom1</th>
          <th>Baris 1, Kolom2</th>
        </tr>
        <tr>
          <th>Baris 2</th>
          <th>Baris 2, Kolom 1</th>
          <th>Baris 2, Kolom 2</th>
        </tr>
      </tbody>
    </table>
  </body>
</html>
