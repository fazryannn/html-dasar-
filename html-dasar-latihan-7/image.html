<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Html</title>
  </head>
  <body>
    <!-- img harus memiliki atribut "src", "alt"(untuk menambahkan teks alternatif pada gambar), "widht&height"(untuk mengubah ukuran gambar)
     "title"(untuk menambahkan judul pada gambar) -->
    <!-- internal resource -->
    <img src="fulllogo.png" alt="LogoZafaz" width="200px" />
    <!-- menggabungkan hyperlink+image -->
    <a href="zafaz.com">
      <img src="fulllogo.png" width="200px" />
    </a>
  </body>
</html>
